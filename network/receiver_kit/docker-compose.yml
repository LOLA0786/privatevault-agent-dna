# Receiver gate (reverse proxy) in front of a dummy payment upstream.
#
#   cp .env.example .env            # fill in the issuer public key
#   python -m network.receiver_kit.keygen receiver   # from the repo root
#   docker compose up --build -d
#
# Port 9001 and GET /_seen on the upstream exist ONLY for this demo so that
# send_test.py can show what never reached it. A real partner never exposes
# the upstream; the gate is its only network path.
#
# The gate container starts as root only to copy ./keys/receiver.key into a
# private tmpfs owned by the gate user (uid 10001, mode 0400), then drops root
# before the gate starts (see entrypoint.sh). The mounted key is never
# modified. This is what makes the same file work on Linux, where a
# bind-mounted 0600 file keeps your uid.

services:
  upstream:
    build:
      context: ../..
      dockerfile: network/receiver_kit/Dockerfile
    command: ["python", "-m", "network.receiver_kit.upstream", "--host", "0.0.0.0", "--port", "9001"]
    ports:
      - "9001:9001"   # DEMO ONLY
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:9001/_health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  gate:
    build:
      context: ../..
      dockerfile: network/receiver_kit/Dockerfile
    depends_on:
      upstream:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      PV_UPSTREAM: http://upstream:9001
      PV_ALLOW_HTTP_UPSTREAM: "1"          # loopback inside the compose network only
      PV_RECEIPT_KEY_FILE: /keys/receiver.key
      PV_LEDGER_PATH: /data/receiver.db
      PV_UNPROTECTED_OPERATIONS: "GET /_health"
      # LOCAL DEMO ONLY. The gate refuses to start without these two: a real
      # receiver serves mutual TLS and pulls the signed revocation list
      # (QUICKSTART.md, "Run it for real").
      PV_RECEIVER_ALLOW_PLAINTEXT: "1"
      PV_RECEIVER_ALLOW_NO_REVOCATION: "1"
      PV_GATE_UID: "${PV_GATE_UID:-10001}"   # the uid the entrypoint drops to
      PV_GATE_GID: "${PV_GATE_GID:-10001}"
    volumes:
      - ./keys:/keys:ro
      - data:/data
    tmpfs:
      - /run/pv
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/_health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  data:
