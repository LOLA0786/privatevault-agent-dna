[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privatevault-coding-eval"
version = "0.1.0"
description = "Standalone PrivateVault evaluation kit for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
    # By URL and full commit: privatevault-agent-dna is not published on PyPI,
    # so a bare ==0.3.0 could only be satisfied by whoever registers the name
    # first. This is the last commit at package version 0.3.0.
    "privatevault-agent-dna @ git+https://github.com/LOLA0786/privatevault-agent-dna@ed653b999ee088eb549f826c40c269134d2cfae6",
]

[project.scripts]
pv-coding-eval = "privatevault_coding_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C90"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
