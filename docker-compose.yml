services:
  privatevault:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - pv_data:/data
    environment:
      - PV_ALLOW_NO_AUTH=1  # dev only: API refuses to start without this or configured keys
      - PV_DB_PATH=/data/privatevault.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pv_data:
