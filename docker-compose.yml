services:
  privatevault:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - pv_data:/data
    environment:
      PV_ALLOW_NO_AUTH: "${PV_ALLOW_NO_AUTH:-0}"
      PV_API_KEYS_FILE: "${PV_API_KEYS_FILE:-}"
      PV_DB_PATH: /data/privatevault.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pv_data:
