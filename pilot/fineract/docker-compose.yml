# Apache Fineract 1.11.0 + PostgreSQL 16.1 — lab counterparty only.
#
# Image and env match apache/fineract@1.11.0 docker-compose-postgresql.yml
# and config/docker/env/{fineract-common,fineract-postgresql,postgresql}.env.
# Docker Hub has no 1.15.0 tag (GitHub latest). Pin the Hub tag that exists.
#
# Allocate ≥6GB to Docker Desktop. Fineract + Postgres OOM mid-boot looks
# like an API-shape bug. Do not invent workarounds for that.
#
# FOR TESTING PURPOSES ONLY. NOT SUITABLE FOR PRODUCTION USAGE.

services:
  tlsgen:
    image: alpine:3.20
    volumes:
      - ./tls:/tls
      - ./tlsgen.sh:/tlsgen.sh:ro
    command: ["sh", "/tlsgen.sh"]

  db:
    image: postgres:16.1
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${FINERACT_DB_PASSWORD:-skdcnwauicn2ucnaecasdsajdnizucawencascdca}
      FINERACT_DB_USER: postgres
      FINERACT_DB_PASS: ${FINERACT_DB_PASSWORD:-skdcnwauicn2ucnaecasdsajdnizucawencascdca}
      FINERACT_TENANTS_DB_NAME: fineract_tenants
      FINERACT_TENANT_DEFAULT_DB_NAME: fineract_default
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "postgres", "-U", "root"]
      interval: 5s
      timeout: 10s
      retries: 20

  fineract:
    image: apache/fineract:1.11.0@sha256:d2da31748f5550b5ebe362b245283b555c71fc914623c29ec1534fe54487f954
    depends_on:
      tlsgen:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    ports:
      - "8443:8443"
    volumes:
      - ./tls:/keystore:ro
    environment:
      FINERACT_SERVER_SSL_ENABLED: "true"
      FINERACT_SERVER_SSL_KEY_STORE: file:/keystore/fineract.p12
      FINERACT_SERVER_SSL_KEY_STORE_PASSWORD: openmf
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      SERVER_SSL_KEY_ALIAS: fineract
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
      FINERACT_HIKARI_JDBC_URL: jdbc:postgresql://db:5432/fineract_tenants
      FINERACT_HIKARI_USERNAME: postgres
      FINERACT_HIKARI_PASSWORD: ${FINERACT_DB_PASSWORD:-skdcnwauicn2ucnaecasdsajdnizucawencascdca}
      FINERACT_HIKARI_MINIMUM_IDLE: "3"
      FINERACT_HIKARI_MAXIMUM_POOL_SIZE: "10"
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: db
      FINERACT_DEFAULT_TENANTDB_PORT: "5432"
      FINERACT_DEFAULT_TENANTDB_UID: postgres
      FINERACT_DEFAULT_TENANTDB_PWD: ${FINERACT_DB_PASSWORD:-skdcnwauicn2ucnaecasdsajdnizucawencascdca}
      FINERACT_DEFAULT_TENANTDB_IDENTIFIER: default
      FINERACT_DEFAULT_TENANTDB_NAME: fineract_default
      FINERACT_DEFAULT_TENANTDB_DESCRIPTION: Default Demo Tenant
      FINERACT_DEFAULT_TENANTDB_TIMEZONE: Asia/Kolkata
      FINERACT_DEFAULT_MASTER_PASSWORD: fineract
      JAVA_TOOL_OPTIONS: "-Xmx1G -XX:MinRAMPercentage=25 -XX:MaxRAMPercentage=80 -XX:+UseContainerSupport"
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          'while ! nc -z localhost 8443; do sleep 1; done',
        ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s

volumes:
  pgdata:
