[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "privatevault-agent-dna"
version = "0.1.0"
description = "Behavioral Identity Platform for Autonomous AI Agents"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = [
    "agent_dna*",
    "api*",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
