[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privatevault-agent-dna"
version = "0.3.0"
description = "Behavioral Identity Platform for Autonomous AI Agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
keywords = ["agent-governance", "ai-safety", "audit", "decision-runtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "typing-extensions>=4.12",
    "jsonschema>=4.21",
    "pynacl>=1.5",
    "PyYAML>=6.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=4.0",
    "httpx>=0.27",
]
integrations = [
    "prometheus-client>=0.20",
    "PyJWT>=2.10",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "requests>=2.32",
    "kafka-python>=2.0",
    "redis>=5.0",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
]

[project.urls]
Homepage = "https://privatevault.ai"

[tool.setuptools.packages.find]
include = ["agent_dna*", "api*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C90"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
exclude = ["tests/"]

[project.scripts]
pv = "agent_dna.cli:main"
