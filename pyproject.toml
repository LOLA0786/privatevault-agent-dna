[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privatevault-agent-dna"
version = "0.4.0"
description = "Fail-closed decision security and evidence-driven control discovery for autonomous agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
keywords = ["agent-governance", "ai-safety", "audit", "decision-runtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "typing-extensions>=4.12",
    "jsonschema>=4.21",
    "pynacl>=1.5",
    "PyYAML>=6.0",
    "mcp>=1.28,<3",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.12",
    "pre-commit>=4.0",
    "httpx>=0.27",
]
integrations = [
    "prometheus-client>=0.20",
    "PyJWT>=2.10",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "requests>=2.32",
    "kafka-python>=2.0",
    "redis>=5.0",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
]

[project.urls]
Homepage = "https://privatevault.ai"

[tool.setuptools.packages.find]
include = ["agent_dna*", "api*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Keep the suite green while still surfacing unexpected warnings in -ra.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
    "ignore:GitBundleAdapter is EXPERIMENTAL:DeprecationWarning",
    "ignore:GrantAuthorizationPolicy is deprecated:DeprecationWarning",
    "ignore:This process .* is multi-threaded, use of fork\\(\\):DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C90"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
sqlite_cache = false
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["prometheus_client", "pv_runtime"]
ignore_missing_imports = true

[project.scripts]
pv = "agent_dna.cli:main"

# Report rendering, multi-source merging and line classification are
# legitimately branchy. Splitting them to satisfy a complexity counter
# would scatter logic without making it clearer.
[tool.ruff.lint.per-file-ignores]
"tools/pvscan.py" = ["C901"]
"tools/build_pvscan_standalone.py" = ["C901"]
"distributions/pvscan.py" = ["C901", "I001", "F401"]
"distributions/pvscan-kit/pvscan.py" = ["C901", "I001", "F401"]
