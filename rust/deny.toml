# Dependency policy for the enforcement runtime.
# The runtime signs audit trails -- its own supply chain must be
# auditable. Enforced in CI by `cargo deny check`.

[advisories]
yanked = "deny"

[licenses]
# pv_runtime itself is commercial/unpublished -- exempt from the
# permissive-only rule that governs its DEPENDENCIES.
private = { ignore = true }
# Everything in the current tree is permissive. Adding a copyleft
# dep to the commercial runtime should be a deliberate, visible act.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Unicode-3.0",
  # unicode-ident < 1.0.13 transitional dual-license; superseded by
  # Unicode-3.0 in current releases. Remove after next cargo update.
  "Unicode-DFS-2016",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
