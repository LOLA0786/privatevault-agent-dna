[package]
name = "pv_runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "pv_runtime"
crate-type = ["cdylib", "rlib"]

[dependencies]
# extension-module is feature-gated: ON for the Python wheel (maturin),
# OFF for `cargo test` so test binaries can link libpython.
pyo3 = { version = "0.29" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

sha2 = "0.11"
hex = "0.4"

thiserror = "2.0"
zeroize = "1.8"

ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }

uuid = { version = "1", features = ["v4"] }

indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
# tests embed a Python interpreter (Python::with_gil) -> need init
pyo3 = { version = "0.29", features = ["auto-initialize"] }

[features]
default = []
extension-module = ["pyo3/extension-module"]

[profile.release]
# overflow-checks ON in release: silent integer wrap inside an
# enforcement runtime is worse than the ~2% cost.
overflow-checks = true
lto = "thin"
codegen-units = 1
# panic stays "unwind" (default): panic=abort under pyo3 kills the
# whole Python interpreter -- fail-DEAD, not fail-closed.
