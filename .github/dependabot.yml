version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 2.x moves mcp.server.fastmcp, breaking agent_dna/mcp_public_verifier.py
      # and the MCP adapter. Unpin when ported. See issue #45.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # react and react-dom must move together (React refuses mismatched
      # versions at runtime); a dependency joins the first group it matches,
      # so this group comes first. Everything else routine: one PR per run.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      dashboard:
        update-types: ["minor", "patch"]
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 3.0 vendors its own rand_core; standalone rand_core::OsRng no longer
      # satisfies its CryptoRng bound at src/signer.rs:69 (E0277). Unpin when
      # key generation moves to dalek's re-exported RNG. 2.2.0 has no advisory.
      - dependency-name: "ed25519-dalek"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # init, autobuild and analyze are one action at one version: a PR that
      # moves only one of them fails (seen in #180).
      codeql:
        patterns: ["github/codeql-action", "github/codeql-action/*"]
      actions-minor:
        update-types: ["minor", "patch"]
  # Base images: digest refreshes of the pinned tag, never a Python version
  # jump. 3.12 -> 3.14 changes the interpreter CI, the Rust wheel (cp312) and
  # the test suite run on; that is a deliberate change of its own.
  - package-ecosystem: docker
    directories:
      - /
      - /network/receiver_kit
      - /demos/live_checkout
      - /proof
      - /deploy/platform
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Dashboard build and serve images: digests only. Node 22 -> 24 and
      # nginx 1.27 -> 1.29 are deliberate changes of their own.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nginx"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
