name: release

# Enterprise hardening (2026-10-19). Signed, attested releases: on a v* tag,
# build the wheel, sdist and container image from the locked environment,
# generate an SBOM, and attach SLSA build provenance signed with Sigstore
# (GitHub OIDC, keyless). Verify with:
#   gh attestation verify dist/<file> --repo LOLA0786/privatevault-agent-dna
#   cosign verify ghcr.io/lola0786/privatevault-agent-dna:<tag> \
#     --certificate-identity-regexp 'https://github.com/LOLA0786/privatevault-agent-dna/.github/workflows/release.yml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://ghcr.io/lola0786/privatevault-agent-dna:<tag> \
#     --repo LOLA0786/privatevault-agent-dna
#
# Dry run (no tag, no GitHub release): run the workflow by hand.
#   gh workflow run release.yml --ref master
# It runs every step except publishing the release: tests, build, SBOM,
# provenance and SBOM attestations, the image pushed as dryrun-<sha> and
# signed, and dist/ uploaded as a workflow artifact for verification.
# A tag must equal the package version (v0.4.0 for 0.4.0); a tag with a
# pre-release part (v0.5.0-rc1) is published as a pre-release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # attach files to the GitHub release
      id-token: write        # Sigstore keyless signing
      attestations: write    # build provenance
      packages: write        # push the image to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # A release tag is SSH-signed by a release manager listed in
      # .github/allowed_signers (in the tagged commit, so changing the list
      # goes through review). git only checks that the key is listed; the
      # principal it is listed for must also be the tagger's email, or any
      # listed key could sign as anyone.
      - name: Tag is signed by a release manager
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git cat-file -t "$TAG")" = tag || { echo "::error::$TAG is not an annotated tag"; exit 1; }
          out=$(git -c gpg.ssh.program=ssh-keygen -c gpg.ssh.allowedSignersFile=.github/allowed_signers verify-tag "$TAG" 2>&1) \
            || { echo "$out"; echo "::error::$TAG is not signed by a key in .github/allowed_signers"; exit 1; }
          signer=$(printf '%s\n' "$out" | sed -n 's/^Good "git" signature for \(.*\) with .* key .*/\1/p')
          tagger=$(git for-each-ref --format='%(taggeremail:trim)' "refs/tags/$TAG")
          test -n "$signer" && test "$signer" = "$tagger" \
            || { echo "$out"; echo "::error::key is listed for '$signer' but the tagger is '$tagger'"; exit 1; }
          echo "Tag $TAG signed by $signer" >> "$GITHUB_STEP_SUMMARY"
      - name: Tag matches the package version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project --with packaging==24.2 python - <<'PY'
          import os, tomllib
          from packaging.version import Version
          tag = os.environ["TAG"]
          pkg = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if not tag.startswith("v") or Version(tag[1:]) != Version(pkg):
              raise SystemExit(f"tag {tag} does not match package version {pkg}")
          print(f"tag {tag} matches package version {pkg}")
          PY
      - name: Tests must pass on the tagged commit
        run: |
          uv sync --locked --extra dev
          uv run python -m pytest -q
      - name: Build wheel and sdist
        run: uv build -o dist
      - name: SBOM
        run: |
          uv export --locked --no-emit-project --format requirements-txt > /tmp/req.txt
          uvx --from cyclonedx-bom==7.2.1 cyclonedx-py requirements /tmp/req.txt --of JSON -o dist/sbom.cdx.json
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Build provenance (SLSA, Sigstore-signed)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: SBOM attestation
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: "dist/*.whl"
          sbom-path: dist/sbom.cdx.json
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push image
        id: image
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" = push ]; then TAG="${{ github.ref_name }}"; else TAG="dryrun-${GITHUB_SHA::12}"; fi
          docker build -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
          REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$TAG")
          {
            echo "name=$IMAGE"
            echo "ref=$REF"
            echo "sha=${REF#*@}"
          } >> "$GITHUB_OUTPUT"
          echo "Image: $IMAGE:$TAG ($REF)" >> "$GITHUB_STEP_SUMMARY"
      - name: Image build provenance (pushed to the registry)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.sha }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless)
        run: cosign sign --yes "${{ steps.image.outputs.ref }}"
      # Verify as a consumer would, before anything is published: the
      # signature must name this workflow and GitHub's OIDC issuer, and the
      # provenance must verify against this repository.
      - name: Verify the image signature and provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.image.outputs.ref }}
        run: |
          cosign verify "$REF" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          gh attestation verify "oci://$REF" --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/release.yml"
          echo "Image signature and provenance verified: $REF" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep dist/ for verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: Publish the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          gh release create "$TAG" dist/* --verify-tag --generate-notes $PRE
