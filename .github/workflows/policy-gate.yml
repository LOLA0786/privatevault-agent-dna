name: policy-gate

# Drop this into a policy repository. Any PR touching a rule file gets
# a divergence report as a comment, and cannot merge if the gate fails.
on:
  pull_request:
    paths:
      - 'policies/**.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate diffs against the base branch. A shallow clone has no
          # merge base, the diff fails, and the gate used to check nothing.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PrivateVault
        run: pip install -e .

      - name: Gate changed policy files
        id: gate
        run: |
          # No "set -e": every changed rule is checked and reported. But the
          # list of changed rules must be computed, and must not be empty:
          # with "set +e" a failed diff yielded no files, no rule was checked
          # and the gate passed (audit finding, infra).
          set -uo pipefail
          STATUS=0
          : > gate_report.md
          if ! changed=$(git diff --name-only "origin/${BASE_REF}..." -- 'policies/*.json'); then
            echo "The gate could not diff against origin/${BASE_REF}, so it checked nothing." | tee -a gate_report.md
            STATUS=1
          elif [ -z "$changed" ]; then
            echo "The gate was triggered by a policy change but found no changed policy file." | tee -a gate_report.md
            STATUS=1
          fi
          for rule in $changed; do
            echo "### \`$rule\`" >> gate_report.md
            echo '```' >> gate_report.md
            pv policy check \
              --rule "$rule" \
              --fixture policies/corpus.jsonl \
              --max-new-blocks "${MAX_NEW_BLOCKS:-0}" \
              --json "gate_$(basename "$rule").json" \
              >> gate_report.md 2>&1
            RC=$?
            echo '```' >> gate_report.md
            [ $RC -ne 0 ] && STATUS=$RC
          done
          cat gate_report.md
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          # Passed through the environment, never interpolated into the script.
          BASE_REF: ${{ github.base_ref }}
          # Raise in the PR (or repo settings) to acknowledge a change
          # that newly blocks previously-allowed decisions.
          MAX_NEW_BLOCKS: ${{ vars.MAX_NEW_BLOCKS || 0 }}

      - name: Comment the divergence report
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('gate_report.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## PrivateVault policy gate\n\n${body}`,
            });

      - name: Upload machine-readable reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: policy-gate-reports
          path: gate_*.json

      - name: Fail the check if the gate failed
        run: exit ${{ steps.gate.outputs.status }}
