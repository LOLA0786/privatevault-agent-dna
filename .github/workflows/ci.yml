name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (canonical command, matches README)
        run: pip install -e ".[dev]"

      - name: Full claim gate (suite + adversarial + verifiers, sealed)
        run: python tools/prove.py -o /tmp/proof-of-run.json

      - name: Upload sealed proof-of-run
        uses: actions/upload-artifact@v4
        with:
          name: proof-of-run
          path: /tmp/proof-of-run.json

      - name: Verify COMMITTED spec vectors (what implementers download)
        run: |
          python tools/verify_records.py spec/test-vectors/clean.jsonl
          ! python tools/verify_records.py spec/test-vectors/tampered_field.jsonl
          ! python tools/verify_records.py spec/test-vectors/deleted_record.jsonl
          ! python tools/verify_records.py spec/test-vectors/divergent.jsonl

      - name: Generator reproduces a verifiable set without touching the spec
        run: |
          python tools/generate_test_vectors.py --out /tmp/ci_vecs
          python tools/verify_records.py /tmp/ci_vecs/clean.jsonl
          git diff --exit-code spec/test-vectors/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t privatevault-agent-dna .
      - name: Container smoke test
        run: |
          docker run -d --name pv -p 8000:8000 privatevault-agent-dna
          sleep 8
          curl -sf localhost:8000/health
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST localhost:8000/v1/decide \
            -H 'Content-Type: application/json' \
            -d '{"agent_id":"ci","capability":"crm.read_contact","timestamp":1751700000}')
          test "$code" = "200"
          docker stop pv
