name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # tests/test_pg_store.py runs the PostgreSQL decision store against it
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      # tests/test_backup.py dumps and restores the PostgreSQL 16 service:
      # use the client tools of the same major version.
      - name: PostgreSQL 16 client tools
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client-16
          fi
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version

      - name: Format gate
        run: >-
          uv run ruff format --check agent_dna api tests tools examples
          experimental benchmarks agents proof demos end_to_end_coding_agents_demo.py
          opa_decision_demo.py

      - name: Lint gate
        run: >-
          uv run ruff check agent_dna api tests tools examples experimental
          benchmarks agents proof demos end_to_end_coding_agents_demo.py opa_decision_demo.py

      - name: Static typing
        run: |
          uv run mypy agent_dna api
          uv run mypy agents proof demos
          uv run mypy --strict --follow-imports=skip agent_dna/security

      - name: Demo demonstrates its own claims
        run: uv run python end_to_end_coding_agents_demo.py

      - name: Full claim gate (suite + adversarial + verifiers, sealed)
        run: uv run python tools/prove.py -o /tmp/proof-of-run.json

      - name: Upload sealed proof-of-run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proof-of-run
          path: /tmp/proof-of-run.json
          if-no-files-found: error

      - name: Verify committed spec vectors
        run: |
          uv run python tools/verify_records.py spec/test-vectors/clean.jsonl
          ! uv run python tools/verify_records.py spec/test-vectors/tampered_field.jsonl
          ! uv run python tools/verify_records.py spec/test-vectors/deleted_record.jsonl
          ! uv run python tools/verify_records.py spec/test-vectors/divergent.jsonl

      - name: Reproduce vectors without changing the committed spec
        run: |
          uv run python tools/generate_test_vectors.py --out /tmp/ci_vecs
          uv run python tools/verify_records.py /tmp/ci_vecs/clean.jsonl
          git diff --exit-code spec/test-vectors/

  helm:
    # deploy/helm/privatevault: lint and render every CI values file, strict
    # Kubernetes schema validation, unsafe configurations refused at render
    # time, then a real install on kind: two replicas on PostgreSQL with the
    # secure profile, helm test, and tools/verify_deployment.py.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.4

      - name: Lint and render every CI values file
        run: |
          set -euo pipefail
          for f in deploy/helm/privatevault/ci/*-values.yaml; do
            helm lint --strict deploy/helm/privatevault -f "$f"
            helm template pv deploy/helm/privatevault -f "$f" > "/tmp/rendered-$(basename "$f")"
          done

      - name: Kubernetes schema validation (kubeconform, strict)
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /tmp kubeconform
          /tmp/kubeconform -strict -summary -kubernetes-version 1.31.0 \
            /tmp/rendered-*.yaml deploy/helm/privatevault/ci/postgres.yaml

      - name: Unsafe configurations are refused at render time
        env:
          RENDER: helm template pv deploy/helm/privatevault -f
        run: bash deploy/helm/privatevault/ci/check-refusals.sh

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: pv

      - name: Install on kind and verify the deployment
        env:
          KIND_CLUSTER: pv
        run: uv run bash deploy/helm/privatevault/ci/kind-e2e.sh

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run test:deps
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t privatevault-agent-dna .
      - name: Container smoke test
        run: |
          docker run -d --name pv -p 8000:8000 -e PV_ALLOW_NO_AUTH=1 privatevault-agent-dna
          for attempt in {1..20}; do
            if curl -sf localhost:8000/health; then break; fi
            if [ "$attempt" = 20 ]; then docker logs pv; exit 1; fi
            sleep 1
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST localhost:8000/v1/decide \
            -H 'Content-Type: application/json' \
            -d '{"agent_id":"ci","capability":"crm.read_contact","timestamp":1751700000}')
          test "$code" = "200"
          test "$(docker inspect --format '{{.Config.User}}' pv)" = "10001:10001"
          docker stop pv
      - name: Image carries the PostgreSQL driver and the AWS KMS client
        run: docker run --rm privatevault-agent-dna python -c "import psycopg, psycopg_pool, boto3"

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: privatevault-gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: privatevault-gate/package-lock.json
      - run: npm ci
      - run: npm test

  contract:
    # The published gate against a real engine. Every schema-contract
    # violation found on 11 Sep 2026 passed both existing pipelines
    # because each half was only ever tested against a fake of the other.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: privatevault-gate/package-lock.json
      - name: Install the engine
        run: uv sync --locked --extra dev
      - name: Start the enforcement engine
        run: |
          PV_ALLOW_NO_AUTH=1 PV_BASELINE_CAPABILITIES=fs.write PV_DB_PATH=/tmp/pv-ci.db \
            uv run python -m uvicorn api.server:app --host 127.0.0.1 --port 8000 \
            > /tmp/pv-engine.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/ready >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/ready || { cat /tmp/pv-engine.log; exit 1; }
      - name: Drive the gate against it
        working-directory: privatevault-gate
        run: |
          npm ci
          npm run test:contract
      - name: Engine log on failure
        if: failure()
        run: tail -n 80 /tmp/pv-engine.log

  receiver-kit-docker:
    # Builds the receiver kit image and runs its entrypoint on a Linux
    # kernel, where a bind-mounted 0600 key keeps the host uid. This is the
    # path Docker Desktop on macOS cannot exercise (it remaps ownership).
    # The test is opt-in so the plain python job never builds images.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked --extra dev
      - name: Receiver kit tests, including the image entrypoint
        env:
          PV_KIT_DOCKER_TESTS: "1"
        run: uv run pytest -q tests/network
      - name: Compose file resolves on this runner
        working-directory: network/receiver_kit
        run: docker compose config --quiet
      - name: Proof runs in a container (P1 to P3)
        env:
          PV_PROOF_DOCKER_TESTS: "1"
        run: uv run pytest -q tests/proof/test_run_all.py

  # Enterprise hardening (2026-10-19): known-vulnerability gate and SBOM for
  # the exact locked dependency set. Fails the build on any known advisory
  # in a runtime or extra dependency (OSV/PyPI advisory database).
  python-supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Export the locked dependency set
        run: |
          uv export --locked --no-emit-project --format requirements-txt > /tmp/req-runtime.txt
          uv export --locked --no-emit-project --all-extras --format requirements-txt > /tmp/req-all.txt
      - name: Known-vulnerability gate (pip-audit, hashes pinned by uv.lock)
        run: |
          uvx pip-audit==2.10.1 -r /tmp/req-all.txt --disable-pip --require-hashes --strict
      - name: CycloneDX SBOM (runtime dependencies)
        run: |
          uvx --from cyclonedx-bom==7.2.1 cyclonedx-py requirements /tmp/req-runtime.txt --of JSON -o sbom-runtime.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom-runtime.cdx.json
