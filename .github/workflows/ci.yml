name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Format gate
        run: >-
          uv run ruff format --check agent_dna api tests tools examples
          experimental benchmarks end_to_end_coding_agents_demo.py
          opa_decision_demo.py

      - name: Lint gate
        run: >-
          uv run ruff check agent_dna api tests tools examples experimental
          benchmarks end_to_end_coding_agents_demo.py opa_decision_demo.py

      - name: Static typing
        run: |
          uv run mypy agent_dna api
          uv run mypy --strict --follow-imports=skip agent_dna/security

      - name: Demo demonstrates its own claims
        run: uv run python end_to_end_coding_agents_demo.py

      - name: Full claim gate (suite + adversarial + verifiers, sealed)
        run: uv run python tools/prove.py -o /tmp/proof-of-run.json

      - name: Upload sealed proof-of-run
        uses: actions/upload-artifact@v4
        with:
          name: proof-of-run
          path: /tmp/proof-of-run.json
          if-no-files-found: error

      - name: Verify committed spec vectors
        run: |
          uv run python tools/verify_records.py spec/test-vectors/clean.jsonl
          ! uv run python tools/verify_records.py spec/test-vectors/tampered_field.jsonl
          ! uv run python tools/verify_records.py spec/test-vectors/deleted_record.jsonl
          ! uv run python tools/verify_records.py spec/test-vectors/divergent.jsonl

      - name: Reproduce vectors without changing the committed spec
        run: |
          uv run python tools/generate_test_vectors.py --out /tmp/ci_vecs
          uv run python tools/verify_records.py /tmp/ci_vecs/clean.jsonl
          git diff --exit-code spec/test-vectors/

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run test:deps
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t privatevault-agent-dna .
      - name: Container smoke test
        run: |
          docker run -d --name pv -p 8000:8000 -e PV_ALLOW_NO_AUTH=1 privatevault-agent-dna
          for attempt in {1..20}; do
            if curl -sf localhost:8000/health; then break; fi
            if [ "$attempt" = 20 ]; then docker logs pv; exit 1; fi
            sleep 1
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST localhost:8000/v1/decide \
            -H 'Content-Type: application/json' \
            -d '{"agent_id":"ci","capability":"crm.read_contact","timestamp":1751700000}')
          test "$code" = "200"
          test "$(docker inspect --format '{{.Config.User}}' pv)" = "10001:10001"
          docker stop pv

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: privatevault-gate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: privatevault-gate/package-lock.json
      - run: npm ci
      - run: npm test

  contract:
    # The published gate against a real engine. Every schema-contract
    # violation found on 11 Sep 2026 passed both existing pipelines
    # because each half was only ever tested against a fake of the other.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: privatevault-gate/package-lock.json
      - name: Install the engine
        run: uv sync --locked --extra dev
      - name: Start the enforcement engine
        run: |
          PV_ALLOW_NO_AUTH=1 PV_BASELINE_CAPABILITIES=fs.write PV_DB_PATH=/tmp/pv-ci.db \
            uv run python -m uvicorn api.server:app --host 127.0.0.1 --port 8000 \
            > /tmp/pv-engine.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/ready >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/ready || { cat /tmp/pv-engine.log; exit 1; }
      - name: Drive the gate against it
        working-directory: privatevault-gate
        run: |
          npm ci
          npm run test:contract
      - name: Engine log on failure
        if: failure()
        run: tail -n 80 /tmp/pv-engine.log
