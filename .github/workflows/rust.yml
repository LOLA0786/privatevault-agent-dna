name: rust

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'rust/**'
      - 'agent_dna/decision_record.py'
      - 'agent_dna/execution_record.py'
      - 'agent_dna/signer*.py'
      - 'tools/rust_parity_check.py'
      - 'tests/test_rust_*.py'
      - 'tests/test_nonfinite_guard.py'
      - 'spec/test-vectors/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-20
        with:
          toolchain: "1.97.1"
          components: clippy,rustfmt

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Rust format gate
        working-directory: rust
        run: cargo fmt --check

      # Panic family denied at crate level; warnings are errors here.
      - name: Clippy (zero warnings)
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      # Rust unit + canonical parity suite (links libpython).
      - name: Rust tests
        working-directory: rust
        run: cargo test

      - name: Build wheel
        working-directory: rust
        run: |
          pip install maturin
          maturin build --release -o /tmp/pv_wheels

      - name: Install project + wheel
        run: |
          pip install -e ".[dev]"
          pip install --force-reinstall /tmp/pv_wheels/pv_runtime-*.whl

      # Gate 1: adversarial cross-implementation hash vectors.
      - name: Python<->Rust hash parity
        run: python tools/rust_parity_check.py

      # Gate 2: Rust vs the DRP spec vectors themselves.
      - name: Spec-vector conformance
        run: python -m pytest tests/test_rust_conformance.py -v

      # Gate 3: deterministic Ed25519 signer parity + fail-closed floats.
      - name: Signer parity + non-finite guard
        run: python -m pytest tests/test_rust_signer_parity.py tests/test_nonfinite_guard.py -v

      # Regression guard: the Rust work must never break Python.
      - name: Full Python suite
        run: python -m pytest tests/ -q

  rust-supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-20
      - name: Install audit tooling
        run: cargo install cargo-audit cargo-deny --locked
      - name: Vulnerability audit (RustSec)
        working-directory: rust
        run: cargo audit
      - name: Dependency policy (advisories, licenses, dupes)
        working-directory: rust
        run: cargo deny check advisories licenses bans sources
