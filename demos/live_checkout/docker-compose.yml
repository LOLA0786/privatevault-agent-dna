# The four demo services under Docker Compose. The agent and the approver run
# on the host and reach the published ports.
#
#   uv run python demos/live_checkout/bootstrap.py      # keys and config into .run/
#   docker compose -f demos/live_checkout/docker-compose.yml up --build -d
#
# .run/ is bind-mounted read-only at /run/pv; services.docker.env points at
# it. Ledgers and the decision store live in the named volume.

services:
  merchant-site:
    build:
      context: ../..
      dockerfile: demos/live_checkout/Dockerfile
    command: ["python", "-m", "demos.live_checkout.services.merchant_site", "--host", "0.0.0.0", "--port", "8701"]
    ports:
      - "8701:8701"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8701/_health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  privatevault-api:
    build:
      context: ../..
      dockerfile: demos/live_checkout/Dockerfile
    command: ["python", "-m", "demos.live_checkout.services.privatevault", "--host", "0.0.0.0", "--port", "8702"]
    env_file:
      - path: .run/services.docker.env
        required: true
    environment:
      PV_LIVE_RUN_DIR: /run/pv
    ports:
      - "8702:8702"
    volumes:
      - ./.run:/run/pv:ro
      - data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8702/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  checkout-api:
    build:
      context: ../..
      dockerfile: demos/live_checkout/Dockerfile
    command: ["python", "-m", "demos.live_checkout.services.checkout_api", "--host", "0.0.0.0", "--port", "8704"]
    ports:
      - "8704:8704"   # DEMO ONLY: a real gateway never exposes the order API past the gate
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8704/_health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  checkout-gate:
    build:
      context: ../..
      dockerfile: demos/live_checkout/Dockerfile
    command: ["python", "-m", "demos.live_checkout.services.gate", "--host", "0.0.0.0", "--port", "8703"]
    depends_on:
      checkout-api:
        condition: service_healthy
    env_file:
      - path: .run/services.docker.env
        required: true
    environment:
      PV_LIVE_RUN_DIR: /run/pv
      PV_UPSTREAM: http://checkout-api:8704
    ports:
      - "8703:8703"
    volumes:
      - ./.run:/run/pv:ro
      - data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8703/_health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  data:
