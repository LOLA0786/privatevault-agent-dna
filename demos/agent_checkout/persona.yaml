# Checkout agent: cart to payment-gateway order. Amounts are INR, whole
# rupees. The authority lives in PrivateVault: these rules compile to
# PV_POLICY_FILE and PV_GRANTS_FILE; nothing here is evaluated by the agent.

name: agent_checkout
agent_id: procurement-agent-01
organisation_id: buyer.example
description: >
  Reads a cart and creates a checkout order at the payment gateway. Every
  order is decided by PrivateVault and reaches the gateway only through a
  single-use permit that the receiver gate in front of the order API
  verifies byte for byte.

tools:
  - read_cart
  - create_checkout_order

# Standing grant. Budget is a cumulative ceiling held in process.
grants:
  - capability: checkout.create_order
    budget: 1000000

# First firing rule wins. Conditions read the decided arguments.
policy:
  - id: hard-cap
    capability: checkout.create_order
    outcome: block
    reason: amount above the hard cap of 2,00,000 INR
    condition:
      field: arguments.amount
      operator: ">"
      value: 200000
  - id: above-approval-threshold
    capability: checkout.create_order
    outcome: require_approval
    reason: amount above 10,000 INR needs a human approval
    condition:
      field: arguments.amount
      operator: ">"
      value: 10000

approvers:
  - principal: procurement-lead@buyer.example
    key_id: approver-procurement-lead

limits:
  currency: INR
  hard_cap: 200000
  approval_threshold: 10000
  budget: 1000000
