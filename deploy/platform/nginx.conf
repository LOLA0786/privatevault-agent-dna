server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /health {
        proxy_pass http://privatevault:8000/health;
    }
    location /ready {
        proxy_pass http://privatevault:8000/ready;
    }
    location /metrics {
        proxy_pass http://privatevault:8000/metrics;
    }
    location /v1/ {
        proxy_pass http://privatevault:8000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key $http_x_api_key;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
