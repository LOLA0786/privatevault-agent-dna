pack_id: customer-internal-policy
version: "0.1.0"
jurisdiction: ORG
title: Customer Internal AI and Data Governance Policy

notes: >
  Synthetic customer-owned policy used to demonstrate the distinction between
  non-binding regulatory mappings and active institution-approved controls.
  This pack makes no claim of legal or regulatory compliance.

