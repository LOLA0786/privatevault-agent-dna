pack_id: uae-cbuae-ai-governance-readiness
version: "0.1.0"
jurisdiction: AE
title: CBUAE Responsible AI Governance Readiness Mapping

notes: >
  Synthetic readiness mapping to CBUAE guidance for licensed financial
  institutions. These controls record proposed organisational mappings.
  They do not claim that CBUAE directly produces a per-action runtime
  verdict. No mapped control becomes binding until a customer approves,
  signs and activates its own executable policy.

