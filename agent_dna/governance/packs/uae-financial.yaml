controls:
  - control_id: ORG-AE-AI-GOVERNANCE-FRAMEWORK-001
    title: Institution should maintain a documented AI governance framework
    mapped_requirements:
      - SRC-AE-CBUAE-AI-GOV-2A

    source:
      authority: Example UAE Licensed Financial Institution
      document: Proposed CBUAE AI Governance Readiness Mapping
      jurisdiction: AE
      status: internal-policy
      citation: Mapping of CBUAE Guidance Section 2(a)
      citation_status: verified
      source_url: ""
      source_hash: ""
      retrieved_at: "2026-07-29"

    applicability:
      entity_types:
        - bank
      action_classes:
        - payment_execution
        - credit_decision
        - customer_data_export
      risk_tiers:
        - high
        - critical

    mode: assessment
    lifecycle: expert-mapped
    interpretation_owner: Pending customer governance function
    approved_by: ""

  - control_id: ORG-AE-BOARD-OVERSIGHT-EVIDENCE-001
    title: High-impact AI use should carry oversight evidence
    mapped_requirements:
